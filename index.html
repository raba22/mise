<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Constants ──────────────────────────────────────────────────
const DAYS  = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MEALS = ['Breakfast','Lunch','Dinner'];
const ICONS = ['☀️','🌤️','🌙'];

// ── Week helpers ───────────────────────────────────────────────
function toISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return `${d.getUTCFullYear()}-W${String(Math.ceil((((d-y)/86400000)+1)/7)).padStart(2,'0')}`;
}

function weekStart(wk) {
  const [yr, w] = wk.split('-W');
  const jan4 = new Date(Date.UTC(+yr, 0, 4));
  const s = new Date(jan4);
  s.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay()||7) - 1));
  s.setUTCDate(s.getUTCDate() + (parseInt(w)-1)*7);
  return s;
}

function weekRange(wk) {
  const s = weekStart(wk), e = new Date(s);
  e.setUTCDate(e.getUTCDate()+6);
  const o = { month:'short', day:'numeric', timeZone:'UTC' };
  return `${s.toLocaleDateString('en-AU',o)} – ${e.toLocaleDateString('en-AU',o)}`;
}

function dayDateStr(wk, di) {
  const d = new Date(weekStart(wk));
  d.setUTCDate(d.getUTCDate()+di);
  return d.toLocaleDateString('en-AU',{month:'short',day:'numeric',timeZone:'UTC'});
}

function todayStr() {
  return new Date().toLocaleDateString('en-AU',{month:'short',day:'numeric'});
}

function isPastDay(wk, di) {
  const d = new Date(weekStart(wk));
  d.setUTCDate(d.getUTCDate() + di);
  const t = new Date();
  const todayUTC = new Date(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()));
  return d < todayUTC;
}

function uid() { return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

// ── Firestore refs ─────────────────────────────────────────────
const rCol  = uid => db.collection('users').doc(uid).collection('recipes');
const wDoc  = (uid,wk) => db.collection('users').doc(uid).collection('weeks').doc(wk);
const stDoc = uid => db.collection('users').doc(uid).collection('meta').doc('streak');

// ── Seed data ──────────────────────────────────────────────────
const SEEDS = [
  { name:'Pasta Napolitana', cuisine:'Italian', prepTime:5, cookTime:20, servings:2, calories:480,
    ingredients:[{item:'pasta',qty:'400',unit:'g'},{item:'garlic cloves',qty:'2',unit:''},{item:'crushed tomatoes',qty:'1',unit:'can'},{item:'fresh basil',qty:'handful',unit:''},{item:'olive oil',qty:'2',unit:'tbsp'},{item:'salt and pepper',qty:'to taste',unit:''}],
    method:'Sauté garlic in olive oil. Add crushed tomatoes, simmer 15 min. Cook pasta al dente. Combine, finish with torn basil.' },
  { name:'Pongal', cuisine:'South Indian', prepTime:5, cookTime:20, servings:2, calories:390,
    ingredients:[{item:'rice',qty:'1',unit:'cup'},{item:'moong dhal',qty:'1/4',unit:'cup'},{item:'salt',qty:'1',unit:'tsp'},{item:'asafoetida',qty:'pinch',unit:''},{item:'ginger',qty:'1',unit:'inch'},{item:'black pepper',qty:'1',unit:'tsp'},{item:'jeera',qty:'1',unit:'tsp'},{item:'cashews',qty:'10',unit:''},{item:'ghee',qty:'2',unit:'tbsp'}],

//  AUTH SCREEN
// ══════════════════════════════════════════════════════════════
function AuthScreen() {
  const [tab,  setTab]  = useState('login');
  const [email,setEmail]= useState('');
  const [pass, setPass] = useState('');
  const [name, setName] = useState('');
  const [err,  setErr]  = useState('');
  const [busy, setBusy] = useState(false);

  async function signInGoogle() {
    setErr(''); setBusy(true);
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      await auth.signInWithPopup(provider);
    } catch(ex) {
      if (ex.code !== 'auth/popup-closed-by-user') setErr(ex.message);
    } finally { setBusy(false); }
  }

  async function submit(e) {
    e.preventDefault(); setErr(''); setBusy(true);
    try {
      if (tab === 'login') {
        await auth.signInWithEmailAndPassword(email, pass);
      } else {
        const c = await auth.createUserWithEmailAndPassword(email, pass);
        if (name) await c.user.updateProfile({ displayName: name });
      }
    } catch(ex) { setErr(ex.message); }
    finally { setBusy(false); }
  }

  return (
    <div className="auth-wrap">
      <div className="auth-box">
        <div className="auth-logo">mise</div>
        <div className="auth-sub">Weekly meal planning, made simple</div>
        <div className="card">
          {/* Google sign-in */}
          <button className="btn-google" onClick={signInGoogle} disabled={busy}>
            <svg width="18" height="18" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            {busy ? <span className="spinner" style={{width:16,height:16}}/> : 'Continue with Google'}
          </button>

          <div className="auth-divider"><span>or</span></div>

          <div className="auth-tabs">
            {['login','signup'].map(t=>(
              <div key={t} className={`auth-tab ${tab===t?'active':''}`} onClick={()=>setTab(t)}>
                {t==='login'?'Sign in with email':'Create account'}
              </div>
            ))}
          </div>
          {err && <div className="auth-error">{err}</div>}
          <form onSubmit={submit}>
            {tab==='signup' && <div className="field"><label>Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" autoFocus/></div>}
            <div className="field"><label>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@email.com" required autoFocus={tab==='login'}/></div>
            <div className="field"><label>Password</label><input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder={tab==='signup'?'Min 6 characters':'Password'} required/></div>
            <button type="submit" className="btn btn-secondary" style={{width:'100%',justifyContent:'center'}} disabled={busy}>
              {busy?<span className="spinner"/>:(tab==='login'?'Sign in':'Create account')}
            </button>
          </form>
        </div>
        <div style={{textAlign:'center',color:'var(--muted)',fontSize:'0.72rem',marginTop:18}}>Your data is private and stored securely in the cloud.</div>
      </div>
    </div>
  );
}

//  RECIPE FORM MODAL
// ══════════════════════════════════════════════════════════════
function RecipeFormModal({ initial, onSave, onClose }) {
  const blank = { name:'', cuisine:'', prepTime:'', cookTime:'', servings:'2', calories:'', ingredients:[{item:'',qty:'',unit:''}], method:'' };
  const [form, setForm] = useState(initial || blank);
  const [busy, setBusy] = useState(false);

  const sf = (k,v) => setForm(f=>({...f,[k]:v}));
  const si = (i,k,v) => setForm(f=>{ const a=[...f.ingredients]; a[i]={...a[i],[k]:v}; return {...f,ingredients:a}; });
  const addIng = () => setForm(f=>({...f,ingredients:[...f.ingredients,{item:'',qty:'',unit:''}]}));
  const delIng = i => setForm(f=>({...f,ingredients:f.ingredients.filter((_,j)=>j!==i)}));

  async function save(e) {
    e.preventDefault(); if(!form.name.trim()) return; setBusy(true);
    await onSave({ ...form,
      prepTime:  parseInt(form.prepTime)||0,
      cookTime:  parseInt(form.cookTime)||0,
      servings:  parseInt(form.servings)||1,
      calories:  parseInt(form.calories)||0,
      ingredients: form.ingredients.filter(r=>r.item.trim()),
    });
    setBusy(false);
  }

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-hd">
          <div className="modal-title">{initial?'Edit Recipe':'New Recipe'}</div>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-bd">
          <form onSubmit={save}>
            <div className="field"><label>Name</label><input value={form.name} onChange={e=>sf('name',e.target.value)} placeholder="e.g. Pasta Napolitana" required autoFocus/></div>
            <div className="two-col">
              <div className="field"><label>Cuisine</label><input value={form.cuisine} onChange={e=>sf('cuisine',e.target.value)} placeholder="e.g. Italian"/></div>
              <div className="field"><label>Calories / serving (kcal)</label><input type="number" min="0" value={form.calories} onChange={e=>sf('calories',e.target.value)} placeholder="e.g. 480"/></div>
            </div>
            <div className="three-col">
              <div className="field"><label>Prep (min)</label><input type="number" min="0" value={form.prepTime} onChange={e=>sf('prepTime',e.target.value)} placeholder="5"/></div>
              <div className="field"><label>Cook (min)</label><input type="number" min="0" value={form.cookTime} onChange={e=>sf('cookTime',e.target.value)} placeholder="20"/></div>
              <div className="field"><label>Servings</label><input type="number" min="1" value={form.servings} onChange={e=>sf('servings',e.target.value)} placeholder="2"/></div>
            </div>
            <div className="field">
              <label>Ingredients</label>
              <div className="ing-row" style={{marginBottom:5}}>
                <span className="ing-hdr">Item</span>
                <span className="ing-hdr">Qty</span>
                <span className="ing-hdr">Unit</span>
                <span/>
              </div>
              {form.ingredients.map((r,i)=>(
                <div className="ing-row" key={i}>
                  <input value={r.item} onChange={e=>si(i,'item',e.target.value)} placeholder="garlic cloves"/>
                  <input value={r.qty}  onChange={e=>si(i,'qty', e.target.value)} placeholder="2"/>
                  <input value={r.unit} onChange={e=>si(i,'unit',e.target.value)} placeholder="cloves"/>
                  <button type="button" className="ing-del" onClick={()=>delIng(i)} disabled={form.ingredients.length<=1}>×</button>
                </div>
              ))}
              <button type="button" className="btn btn-ghost btn-sm" onClick={addIng} style={{marginTop:4}}>+ ingredient</button>
            </div>
            <div className="field"><label>Method (optional)</label><textarea rows={3} value={form.method} onChange={e=>sf('method',e.target.value)} placeholder="Step-by-step…" style={{resize:'vertical'}}/></div>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:4}}>
              <button type="button" className="btn btn-ghost" onClick={onClose}>Cancel</button>
              <button type="submit" className="btn btn-primary" disabled={busy}>{busy?<span className="spinner"/>:'Save recipe'}</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  GROCERY TAB
// ══════════════════════════════════════════════════════════════
function GroceryTab({ recipes, weekData, weekKey, userId, wDoc: wDocFn }) {
  const [manualInput, setManualInput] = useState('');

  const recipeMap = new Map();
  if (weekData?.meals) {
    Object.values(weekData.meals).forEach(slot => {
      const r = recipes.find(x=>x.id===slot.recipeId);
      if (r && !recipeMap.has(r.id)) recipeMap.set(r.id, r);
    });
  }

  async function toggleCheck(key) {
    const sc = { ...(weekData?.shopChecked||{}), [key]: !(weekData?.shopChecked?.[key]) };
    await wDocFn(userId, weekKey).set({ ...weekData, shopChecked: sc }, { merge: true });
  }

  async function addManual() {
    if (!manualInput.trim()) return;
    const items = [...(weekData?.manualItems||[]), { id: uid(), text: manualInput.trim(), checked: false }];
    await wDocFn(userId, weekKey).set({ ...weekData, manualItems: items }, { merge: true });
    setManualInput('');
  }

  async function toggleManual(id) {
    const items = (weekData?.manualItems||[]).map(it=>it.id===id?{...it,checked:!it.checked}:it);
    await wDocFn(userId, weekKey).set({ ...weekData, manualItems: items }, { merge: true });
  }

  async function deleteManual(id) {
    const items = (weekData?.manualItems||[]).filter(it=>it.id!==id);
    await wDocFn(userId, weekKey).set({ ...weekData, manualItems: items }, { merge: true });
  }

  const noMeals = recipeMap.size === 0;
  const noManual = (weekData?.manualItems||[]).length === 0;

  return (<>
    <div className="section-hd">
      <div className="section-ttl">Grocery List</div>
      <div style={{fontSize:'0.75rem',color:'var(--muted)'}}>{weekRange(weekKey)}</div>
    </div>

    {noMeals && noManual && (
      <div className="empty-state">No meals planned this week yet.<br/>Head to the Planner tab to add some.</div>
    )}

    {[...recipeMap.values()].map(recipe=>(
      <div key={recipe.id}>
        <div className="shop-section-title">{recipe.name}</div>
        {(recipe.ingredients||[]).map((ing,i)=>{
          const key = `${recipe.id}_${i}`;
          const checked = !!(weekData?.shopChecked?.[key]);
          const qty = [ing.qty, ing.unit].filter(Boolean).join(' ');
          return (
            <div key={i} className={`shop-item ${checked?'done':''}`}>
              <input type="checkbox" checked={checked} onChange={()=>toggleCheck(key)}/>
              <span className="shop-item-text">{ing.item}</span>
              {qty && <span className="shop-item-qty">{qty}</span>}
            </div>
          );
        })}
      </div>
    ))}

    <div>
      <div className="shop-section-title">Added manually</div>
      {(weekData?.manualItems||[]).map(it=>(
        <div key={it.id} className={`shop-item ${it.checked?'done':''}`}>
          <input type="checkbox" checked={it.checked} onChange={()=>toggleManual(it.id)}/>
          <span className="shop-item-text">{it.text}</span>
          <button className="shop-del" onClick={()=>deleteManual(it.id)}>✕</button>
        </div>
      ))}
      <div className="manual-row">
        <input
          placeholder="Add an item…"
          value={manualInput}
          onChange={e=>setManualInput(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&addManual()}
        />
        <button className="btn btn-primary btn-sm" onClick={addManual}>Add</button>
      </div>
    </div>
  </>);
}

// ══════════════════════════════════════════════════════════════
//  MAIN APP
// ══════════════════════════════════════════════════════════════
function App() {
  const [user,     setUser]     = useState(undefined);
  const [recipes,  setRecipes]  = useState([]);
  const [weekData, setWeekData] = useState(null);
  const [weekKey,  setWeekKey]  = useState(toISOWeek(new Date()));
  const [streak,   setStreak]   = useState(0);
  const [view,     setView]     = useState('planner');
  const [modal,    setModal]    = useState(null);
  const [seeding,  setSeeding]  = useState(false);
  const wdUnsub = useRef(null);

  // Auth
  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => setUser(u || null));
    return unsub;
  }, []);

  // Recipes listener
  useEffect(() => {
    if (!user) { setRecipes([]); return; }
    const unsub = rCol(user.uid).orderBy('name').onSnapshot(snap => {
      const data = snap.docs.map(d=>({id:d.id,...d.data()}));
      setRecipes(data);
      if (data.length===0 && !seeding) seedRecipes(user.uid);
    });
    return unsub;
  }, [user]);

  // Week data listener
  useEffect(() => {
    if (!user) return;
    if (wdUnsub.current) wdUnsub.current();
    const unsub = wDoc(user.uid, weekKey).onSnapshot(snap => {
      setWeekData(snap.exists ? snap.data() : { meals:{}, manualItems:[], shopChecked:{} });
    });
    wdUnsub.current = unsub;
    return unsub;
  }, [user, weekKey]);

  // Streak
  useEffect(() => {
    if (!user) return;
    stDoc(user.uid).get().then(s => { if(s.exists) setStreak(s.data().count||0); });
  }, [user]);

  async function seedRecipes(uid) {
    setSeeding(true);
    const batch = db.batch();
    SEEDS.forEach(r => batch.set(rCol(uid).doc(), r));
    await batch.commit();
    setSeeding(false);
  }

  function shiftWeek(d) {
    const s = weekStart(weekKey);
    s.setUTCDate(s.getUTCDate() + d*7);
    setWeekKey(toISOWeek(new Date(s)));
  }

  function slotKey(di, meal) { return `${di}_${meal.toLowerCase()}`; }
  function getMeal(di, meal) { return weekData?.meals?.[slotKey(di,meal)] || null; }
  function getRecipe(id)     { return recipes.find(r=>r.id===id) || null; }

  async function setMeal(di, meal, recipeId) {
    const key = slotKey(di, meal);
    const docRef = wDoc(user.uid, weekKey);
    if (recipeId) {
      await docRef.set({ meals: { [key]: { recipeId, cooked: false } } }, { merge: true });
    } else {
      await docRef.update({ [`meals.${key}`]: firebase.firestore.FieldValue.delete() });
    }
  }

  async function toggleCooked(di, meal) {
    const key = slotKey(di, meal);
    const slot = weekData?.meals?.[key];
    if (!slot) return;
    await wDoc(user.uid, weekKey).update({ [`meals.${key}.cooked`]: !slot.cooked });
  }

  function calcScore() {
    const all = weekData?.meals ? Object.values(weekData.meals) : [];
    const planned = all.length, cooked = all.filter(s=>s.cooked).length;
    const planPct = Math.round(planned/21*100);
    const cookPct = planned>0 ? Math.round(cooked/planned*100) : 0;
    return { planned, cooked, planPct, cookPct, score: Math.round(planPct*0.35+cookPct*0.65) };
  }

  function dailyCalories() {
    return DAYS.map((_,di) => {
      let total = 0;
      MEALS.forEach(meal => {
        const slot = getMeal(di, meal);
        if (!slot) return;
        const r = getRecipe(slot.recipeId);
        if (r?.calories) total += r.calories;
      });
      return total;
    });
  }

  async function saveRecipe(data, id) {
    if (id) await rCol(user.uid).doc(id).set(data);
    else await rCol(user.uid).add(data);
    setModal(null);
  }

  async function deleteRecipe(id) {
    if (!confirm('Delete this recipe?')) return;
    await rCol(user.uid).doc(id).delete();
    setModal(null);
  }

  async function autoFill() {
    if (recipes.length === 0) return;
    const newMeals = {};
    DAYS.forEach((_, di) => {
      MEALS.forEach(meal => {
        const key = slotKey(di, meal);
        if (!weekData?.meals?.[key]) {
          const r = recipes[Math.floor(Math.random() * recipes.length)];
          newMeals[key] = { recipeId: r.id, cooked: false };
        }
      });
    });
    if (Object.keys(newMeals).length > 0)
      await wDoc(user.uid, weekKey).set({ meals: newMeals }, { merge: true });
  }

  async function copyLastWeek() {
    const s = weekStart(weekKey);
    s.setUTCDate(s.getUTCDate() - 7);
    const prevWk = toISOWeek(new Date(s));
    const snap = await wDoc(user.uid, prevWk).get();
    if (!snap.exists) return alert('No plan found for last week.');
    const prevMeals = snap.data()?.meals || {};
    if (Object.keys(prevMeals).length === 0) return alert('Last week had no meals planned.');
    const newMeals = {};
    Object.entries(prevMeals).forEach(([key, slot]) => {
      if (!weekData?.meals?.[key])
        newMeals[key] = { recipeId: slot.recipeId, cooked: false };
    });
    if (Object.keys(newMeals).length > 0)
      await wDoc(user.uid, weekKey).set({ meals: newMeals }, { merge: true });
  }

  function renderSlot(di, meal) {
    const slot   = getMeal(di, meal);
    const recipe = slot ? getRecipe(slot.recipeId) : null;
    return (
      <div
        className={`slot ${slot?'filled':'empty'} ${slot?.cooked?'cooked':''}`}
        onClick={()=> slot
          ? setModal({type:'slotAction', di, meal})
          : setModal({type:'picker', di, meal, currentId: null})
        }
      >
        {recipe ? (<>
          <button className="slot-clear" onClick={e=>{ e.stopPropagation(); setMeal(di, meal, null); }} title="Clear slot">✕</button>
          <div className="slot-name">{recipe.name}</div>
          <div className="slot-meta">
            {recipe.cuisine && <span>{recipe.cuisine}</span>}
            {(recipe.prepTime||recipe.cookTime) ? <span> · {(recipe.prepTime||0)+(recipe.cookTime||0)}m</span> : null}
          </div>
          {recipe.calories>0 && <div className="slot-kcal">{recipe.calories} kcal</div>}
        </>) : (<>
          <div className="slot-empty-icon">+</div>
          <div className="slot-empty-text">Add meal</div>
        </>)}
      </div>
    );
  }

  // ── Loading / auth gate ──────────────────────────────────────
  if (user === undefined) return <div className="loading-full"><span className="spinner"/><span>Loading…</span></div>;
  if (!user) return <AuthScreen/>;

  const sc = calcScore();
  const calsByDay = dailyCalories();
  const hasCals = calsByDay.some(c=>c>0);

  return (
    <div className="app-shell">
      {/* Top bar */}
      <div className="topbar">
        <div className="topbar-logo">mise</div>
        {streak>0 && <span className="streak-badge" style={{fontSize:'0.7rem',padding:'2px 8px'}}>🔥 {streak}w</span>}
        <div className="topbar-spacer"/>
        <div className="topbar-week">{weekKey}</div>
        <div className="topbar-user">{user.displayName||user.email}</div>
        <button className="btn btn-ghost btn-sm" onClick={()=>auth.signOut()}>Sign out</button>
      </div>

      <div className="main">
        {/* View tabs */}
        <div className="view-tabs">
          <button className={`view-tab ${view==='planner'?'active':''}`}  onClick={()=>setView('planner')}>📅 Planner</button>
          <button className={`view-tab ${view==='grocery'?'active':''}`}  onClick={()=>setView('grocery')}>🛒 Grocery</button>
          <button className={`view-tab ${view==='recipes'?'active':''}`}  onClick={()=>setView('recipes')}>📖 Recipes</button>
        </div>

        {/* ── PLANNER ── */}
        {view==='planner' && <>
          <div className="week-nav">
            <button className="btn btn-ghost btn-sm" onClick={()=>shiftWeek(-1)}>← Prev</button>
            <div className="week-nav-label">{weekRange(weekKey)}</div>
            <button className="btn btn-ghost btn-sm" onClick={()=>shiftWeek(1)}>Next →</button>
          </div>
          <div className="week-actions" style={{display:'flex',gap:8,marginBottom:18,justifyContent:'flex-end'}}>
            <button className="btn btn-ghost btn-sm" onClick={copyLastWeek} title="Copy last week's meals into empty slots">↩ Copy last week</button>
            <button className="btn btn-ghost btn-sm" onClick={autoFill} title="Randomly fill empty slots from your recipe library">⚡ Auto-fill empty</button>
          </div>

          <div className="score-bar">
            <div className="score-pill">
              <div className="score-pill-label">
                Week Score
                <span className="score-info">
                  <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor" style={{color:'var(--muted)'}}>
                    <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zm0 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm0 3.75a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5zm0 2.5a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0V8.5A.75.75 0 0 1 8 7.75z"/>
                  </svg>
                  <span className="score-tip">35% from meals planned (/21)<br/>65% from meals cooked</span>
                </span>
              </div>
              <div className={`score-pill-value ${sc.score>=70?'c-accent2':sc.score>=40?'c-warn':'c-accent'}`}>
                {sc.score}<span style={{fontSize:'0.68rem',fontWeight:400,color:'var(--muted)'}}>/100</span>
              </div>
              <div className="progress-bar-wrap"><div className="progress-bar-fill" style={{width:`${sc.score}%`,background:sc.score>=70?'var(--accent2)':sc.score>=40?'var(--warn)':'var(--accent)'}}/></div>
            </div>
            <div className="score-pill">
              <div className="score-pill-label">Planned</div>
              <div className="score-pill-value c-accent">{sc.planned}<span style={{fontSize:'0.68rem',fontWeight:400,color:'var(--muted)'}}>/21</span></div>
              <div className="progress-bar-wrap"><div className="progress-bar-fill" style={{width:`${sc.planPct}%`,background:'var(--accent)'}}/></div>
            </div>
            <div className="score-pill">
              <div className="score-pill-label">Cooked</div>
              <div className="score-pill-value c-accent2">{sc.cooked}{sc.planned>0&&<span style={{fontSize:'0.68rem',fontWeight:400,color:'var(--muted)'}}>/{sc.planned}</span>}</div>
              <div className="progress-bar-wrap"><div className="progress-bar-fill" style={{width:`${sc.cookPct}%`,background:'var(--accent2)'}}/></div>
            </div>
            {streak>0 && <div className="score-pill" style={{display:'flex',alignItems:'center',justifyContent:'center'}}>
              <div className="streak-badge">🔥 {streak} week{streak!==1?'s':''} streak</div>
            </div>}
          </div>

          {/* Daily calorie pills */}
          {hasCals && (
            <div className="calorie-row">
              {calsByDay.map((cal,di) => cal>0 ? (
                <div key={di} className="calorie-pill">
                  <span className="calorie-pill-day">{DAYS[di].slice(0,3)}</span>
                  <span>{cal} kcal</span>
                </div>
              ) : null)}
            </div>
          )}

          {/* Desktop planner grid */}
          <div className="planner-wrap desktop-planner">
            <table className="planner-table">
              <thead>
                <tr>
                  <th/>
                  {MEALS.map((m,mi)=><th key={m}>{ICONS[mi]} {m}</th>)}
                </tr>
              </thead>
              <tbody>
                {DAYS.map((day,di)=>{
                  const isToday = dayDateStr(weekKey,di)===todayStr();
                  const past    = isPastDay(weekKey,di) && !isToday;
                  return (
                    <tr key={day} className={past?'past-day':''}>
                      <td>
                        <div className={isToday?'today':''}>
                          <div className="day-name">{day.slice(0,3)}</div>
                          <div className="day-date">{dayDateStr(weekKey,di)}</div>
                        </div>
                      </td>
                      {MEALS.map(meal=>(
                        <td key={meal}>{renderSlot(di, meal)}</td>
                      ))}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* Mobile planner cards */}
          <div className="mobile-planner">
            {DAYS.map((day,di)=>{
              const isToday = dayDateStr(weekKey,di)===todayStr();
              const past    = isPastDay(weekKey,di) && !isToday;
              return (
                <div key={day} className={`day-card ${past?'past-day':''}`}>
                  <div className={`day-card-hd ${isToday?'today':''}`}>
                    <div className="day-name">{day}</div>
                    <div className="day-date">{dayDateStr(weekKey,di)}</div>
                  </div>
                  <div className="day-card-meals">
                    {MEALS.map((meal,mi)=>(
                      <div key={meal}>
                        <div className="day-card-meal-label">{ICONS[mi]} {meal}</div>
                        {renderSlot(di, meal)}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </>}

        {/* ── GROCERY ── */}
        {view==='grocery' && (
          <GroceryTab
            recipes={recipes}
            weekData={weekData}
            weekKey={weekKey}
            userId={user.uid}
            wDoc={wDoc}
          />
        )}

        {/* ── RECIPES ── */}
        {view==='recipes' && <>
          <div className="section-hd">
            <div className="section-ttl">Recipe Library</div>
            <button className="btn btn-primary btn-sm" onClick={()=>setModal({type:'recipeForm'})}>+ New recipe</button>
          </div>
          {recipes.length===0 && <div className="empty-state">{seeding?'Loading seed recipes…':'No recipes yet. Add one!'}</div>}
          <div className="recipe-grid">
            {recipes.map(r=>(
              <div key={r.id} className="recipe-card" onClick={()=>setModal({type:'recipeDetail',recipe:r})}>
                <div className="recipe-card-name">{r.name}</div>
                <div className="recipe-card-meta">
                  {r.cuisine && <span>{r.cuisine}</span>}
                  {(r.prepTime||r.cookTime) ? <span>{(r.prepTime||0)+(r.cookTime||0)} min</span> : null}
                  {r.calories>0 && <span style={{color:'var(--accent2)',fontWeight:600}}>{r.calories} kcal</span>}
                </div>
              </div>
            ))}
          </div>
        </>}
      </div>

      {/* ── MODALS ── */}
      {modal?.type==='slotAction' && (()=>{
        const slot   = weekData?.meals?.[slotKey(modal.di, modal.meal)];
        const recipe = slot ? getRecipe(slot.recipeId) : null;
        if (!slot || !recipe) return null;
        return (
          <SlotActionModal
            recipe={recipe}
            slot={slot}
            onToggleCooked={()=>{ toggleCooked(modal.di, modal.meal); setModal(null); }}
            onViewRecipe={()=>setModal({type:'recipeDetail', recipe, fromSlot:{di:modal.di, meal:modal.meal}})}
            onChangeRecipe={()=>setModal({type:'picker', di:modal.di, meal:modal.meal, currentId:slot.recipeId})}
            onClear={()=>{ setMeal(modal.di, modal.meal, null); setModal(null); }}
            onClose={()=>setModal(null)}
          />
        );
      })()}
      {modal?.type==='picker' && (
        <MealPickerModal
          recipes={recipes}
          currentId={modal.currentId}
          onPick={r=>{ setMeal(modal.di, modal.meal, r.id); setModal(null); }}
          onClear={()=>{ setMeal(modal.di, modal.meal, null); setModal(null); }}
          onClose={()=>setModal(null)}
        />
      )}
      {modal?.type==='recipeForm' && (
        <RecipeFormModal
          initial={modal.recipe}
          onSave={data=>saveRecipe(data, modal.recipe?.id)}
          onClose={()=>setModal(null)}
        />
      )}
      {modal?.type==='recipeDetail' && (
        <RecipeDetailModal
          recipe={modal.recipe}
          onEdit={()=>setModal({type:'recipeForm', recipe:modal.recipe})}
          onDelete={()=>deleteRecipe(modal.recipe.id)}
          onClose={()=> modal.fromSlot
            ? setModal({type:'slotAction', di:modal.fromSlot.di, meal:modal.fromSlot.meal})
            : setModal(null)
          }
        />
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  ENTRY
// ══════════════════════════════════════════════════════════════
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
